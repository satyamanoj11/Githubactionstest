name: Nani Org Sample Validation

on:
  pull_request:
    branches:
      - 'featureQA/**'

jobs:
  validate_Sf_Deployment:
    runs-on: ubuntu-latest
    steps:
      # Install Salesforce CLI
      - name: "Install Salesforce CLI"
        run: |
          npm install @salesforce/cli --location=global
          nodeInstallPath=$(npm config get prefix)
          echo "$nodeInstallPath/bin">> $GITHUB_PATH
          npm fund
          sf --version
      # Install SGD plugin for delta package
      - name: "Install SGD Plugin"
        # run: "sf plugins install sfdx-git-delta --help"
        run: |
          echo y | sf plugins install sfdx-git-delta
          sfdx plugins
      # Install Utilities
      - name: Install utilities"
        run: |
         pip install yq
         xq ---version
      # checkout the code in the feature branch 
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Authenticate the target org for validation and deployment
      - name: "Authentication to target Org"
        env:
          SF_QA_ORG__AUTH_URL: ${{ secrets.SF_QA_ORG__AUTH_URL }}
        run: |
          echo "$NANIORG_SECRET" > ./SFDX_URL.txt
          sf org login sfdx-url --set-default -f ./SFDX_URL.txt
          sf org list
      # Delta package deployment
      - name: "Delta Deploy"
        run : |
          sf sgd source delta --to "HEAD" --from "origin/QAN" --output "." -i .forceignore
          echo "---package.xml generated with added and modified metadata---"
          cat package/package.xml
          echo
          sf project deploy validate -x package/package.xml